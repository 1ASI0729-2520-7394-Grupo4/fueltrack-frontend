<mat-sidenav-container class="sidenav-container">

  <mat-sidenav-content class="main-content">
    <div class="page-header">
      <div class="title-block">
        <h1>Dispatch</h1>
      </div>
      <div class="breadcrumb">
        <span>Home</span>
        <mat-icon>chevron_right</mat-icon>
        <span>Dispatch</span>
      </div>
    </div>

    <div class="page-subcontent">
      <div>
        <p>Check your order’s payments and approve them!</p>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="value">651.9K</span>
          <span class="label">Total Orders</span>
        </div>
        <div class="divider"></div>
        <div class="stat">
          <span class="value">607.78K</span>
          <span class="label">Approved</span>
        </div>
        <div class="divider"></div>
        <div class="stat">
          <span class="value">44.12K</span>
          <span class="label">Requested</span>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="tabs">
        <button mat-stroked-button color="warn" class="tab active">
          Release Orders
        </button>
      </div>
      <div class="filter-buttons">
        <button mat-flat-button>
          <mat-icon>filter_list</mat-icon>
          Filters
        </button>
        <button mat-flat-button>
          <mat-icon>date_range</mat-icon>
          Date Range
        </button>
      </div>
    </div>

    <div class="table-container">
      <table
        mat-table
        [dataSource]="store.orders()"
        multiTemplateDataRows
        class="mat-elevation-z8"
      >
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef>
            <mat-checkbox
              (change)="toggleAll($event)"
              [checked]="isAllSelected()"
            ></mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let row">
            <mat-checkbox
              (change)="toggleOne(row)"
              [checked]="selection.isSelected(row)"
            ></mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="created">
          <th mat-header-cell *matHeaderCellDef>Created</th>
          <td mat-cell *matCellDef="let row">{{ row.created }}</td>
        </ng-container>

        <ng-container matColumnDef="user">
          <th mat-header-cell *matHeaderCellDef>Customer</th>
          <td mat-cell *matCellDef="let row">{{ row.user }}</td>
        </ng-container>

        <ng-container matColumnDef="amount">
          <th mat-header-cell *matHeaderCellDef>Amount</th>
          <td mat-cell *matCellDef="let row">{{ row.amount }}</td>
        </ng-container>

        <ng-container matColumnDef="terminal">
          <th mat-header-cell *matHeaderCellDef>Terminal</th>
          <td mat-cell *matCellDef="let row">{{ row.terminal }}</td>
        </ng-container>

        <ng-container matColumnDef="release">
          <th mat-header-cell *matHeaderCellDef>For release</th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button>
              <mat-icon class="icon-green">check_circle_outline</mat-icon>
            </button>
          </td>
        </ng-container>

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>Cargo</th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button>
              <mat-icon class="icon-white">settings</mat-icon>
            </button>
          </td>
        </ng-container>

        <!-- Filas normales y fila expandida -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
