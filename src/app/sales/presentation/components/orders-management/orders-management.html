<div [ngClass]="{ 'supplier-theme': 'supplier' }">
  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav-content class="main-content">
      <div class="page-header">
        <div class="title-block">
          <h1>Order Management</h1>
        </div>
        <div class="breadcrumb">
          <span>Home</span>
          <mat-icon>chevron_right</mat-icon>
          <span>Order Management</span>
        </div>
      </div>

      <div class="page-subcontent">
        <div>
          <p>Manage your customers' orders</p>
        </div>
        <div class="stats">
          <div class="stat">
            <span class="value">651.9K</span>
            <span class="label">Total Orders</span>
          </div>
          <div class="divider"></div>
          <div class="stat">
            <span class="value">607.78K</span>
            <span class="label">Approved</span>
          </div>
          <div class="divider"></div>
          <div class="stat">
            <span class="value">44.12K</span>
            <span class="label">Requested</span>
          </div>
        </div>
      </div>

      <div class="controls">
        <div class="tabs">
          <button
            mat-stroked-button
            color="warn"
            class="tab active"
            matBadge="621"
            matBadgePosition="after"
          >
            Requested
          </button>
          <button
            mat-stroked-button
            color="primary"
            class="tab"
            matBadge="2.55K"
            matBadgePosition="after"
          >
            Approved
          </button>
          <button
            mat-stroked-button
            color="primary"
            class="tab"
            matBadge="45"
            matBadgePosition="after"
          >
            Released
          </button>
          <button
            mat-stroked-button
            color="primary"
            class="tab"
            matBadge="12"
            matBadgePosition="after"
          >
            Dispatched
          </button>
          <button
            mat-stroked-button
            color="primary"
            class="tab"
            matBadge="1.56K"
            matBadgePosition="after"
          >
            Closed
          </button>
        </div>

        <div class="filter-buttons">
          <button mat-flat-button>
            <mat-icon>filter_list</mat-icon>
            Filters
          </button>
          <button mat-flat-button>
            <mat-icon>date_range</mat-icon>
            Date Range
          </button>
        </div>
      </div>

      <div class="table-container">
        <table
          mat-table
          [dataSource]="store.orders()"
          multiTemplateDataRows
          class="mat-elevation-z8"
        >
          <ng-container matColumnDef="expand">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button (click)="toggleRow(row)">
                <mat-icon class="icon-white">
                  {{ expandedElement === row ? "expand_less" : "chevron_right" }}
                </mat-icon>
              </button>
            </td>
          </ng-container>

          <ng-container matColumnDef="created">
            <th mat-header-cell *matHeaderCellDef>Created</th>
            <td mat-cell *matCellDef="let row">{{ row.created }}</td>
          </ng-container>

          <ng-container matColumnDef="user">
            <th mat-header-cell *matHeaderCellDef>Customer</th>
            <td mat-cell *matCellDef="let row">{{ row.user }}</td>
          </ng-container>

          <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef>Amount</th>
            <td mat-cell *matCellDef="let row">{{ row.amount }}</td>
          </ng-container>

          <ng-container matColumnDef="terminal">
            <th mat-header-cell *matHeaderCellDef>Terminal</th>
            <td mat-cell *matCellDef="let row">{{ row.terminal }}</td>
          </ng-container>

          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>Order ID</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button>
                <mat-icon class="icon-white">content_copy</mat-icon>
              </button>
              {{ row.id }}
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          <tr
            mat-row
            *matRowDef="let row; when: isExpandedRow"
            class="expanded-row"
          >
            <td [attr.colspan]="displayedColumns.length">
              <div class="expanded-content">
                Order details for {{ row.id }}…
              </div>
            </td>
          </tr>
        </table>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
