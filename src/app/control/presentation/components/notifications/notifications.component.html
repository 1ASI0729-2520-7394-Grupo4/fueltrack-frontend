<h2 class="section-title">Notifications</h2>

<div class="notification-group" *ngFor="let group of notifications">
  <h4 class="group-date">{{ group.date }}</h4>
  <mat-card class="notification-card" *ngFor="let note of group.items">
    <mat-icon class="icon" [ngClass]="note.type">{{ getIcon(note.type) }}</mat-icon>
    <div class="note-content">
      <p class="note-title">{{ note.title }}</p>
      <p class="note-message">{{ note.message }}</p>
    </div>
  </mat-card>
</div>
