<h2 class="section-title">Fuel Providers</h2>

<mat-card class="provider-card" *ngFor="let provider of providers">
  <div class="card-header">
    <div>
      <h3>{{ provider.name }}</h3>
      <p class="type">{{ provider.fuelType }}</p>
    </div>
    <span class="status" [ngClass]="provider.status.toLowerCase()">{{ provider.status }}</span>
  </div>
  <p class="note">{{ provider.note }}</p>
</mat-card>
